name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WhyDidIReboot.slnx

      - name: Build
        run: dotnet build WhyDidIReboot.slnx -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test WhyDidIReboot.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results

      - name: Smoke test (headless export against the runner's event log)
        shell: pwsh
        run: |
          $exe = 'src/WhyDidIReboot/bin/Release/net8.0-windows/WhyDidIReboot.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--export smoke.txt --days all --sleep' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Export exited with $($p.ExitCode)" }
          $text = Get-Content smoke.txt -Raw
          if ($text -match '^ERROR:') { throw $text }
          if ($text -notmatch 'Why Did I Reboot') { throw 'Unexpected report header' }
          Write-Host "Report is $($text.Length) chars; first lines:"
          Get-Content smoke.txt -TotalCount 8

      - name: Publish (framework-dependent)
        run: dotnet publish src/WhyDidIReboot -c Release --no-build -o dist/framework-dependent

      - name: Publish (self-contained single file)
        run: dotnet publish src/WhyDidIReboot -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/self-contained

      - name: Upload framework-dependent build
        uses: actions/upload-artifact@v6
        with:
          name: WhyDidIReboot-framework-dependent
          path: dist/framework-dependent

      - name: Upload self-contained build
        uses: actions/upload-artifact@v6
        with:
          name: WhyDidIReboot-win-x64
          path: dist/self-contained/WhyDidIReboot.exe

  release:
    # Tag pushes matching v* (SemVer) publish a GitHub Release with the built binaries.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out (for CHANGELOG.md)
        uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no '## [$version]' section. Add one before tagging v$version." }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { break }
            $body += $lines[$i]
          }
          $body = ($body -join "`n").Trim()
          if (-not $body) { throw "The '## [$version]' section in CHANGELOG.md is empty." }
          $body += "`n`n## Downloads`n" +
                   "- **WhyDidIReboot.exe** runs on any 64-bit Windows 10/11 PC with nothing installed.`n" +
                   "- **WhyDidIReboot-framework-dependent.zip** is much smaller but needs the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)."
          Set-Content -Path release-notes.md -Value $body
          Write-Host $body

      - name: Download self-contained build
        uses: actions/download-artifact@v8
        with:
          name: WhyDidIReboot-win-x64
          path: assets/self-contained

      - name: Download framework-dependent build
        uses: actions/download-artifact@v8
        with:
          name: WhyDidIReboot-framework-dependent
          path: assets/framework-dependent

      - name: Package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item assets/self-contained/WhyDidIReboot.exe out/WhyDidIReboot.exe
          Compress-Archive -Path assets/framework-dependent/* -DestinationPath out/WhyDidIReboot-framework-dependent.zip
          Get-ChildItem out

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $args = @('release', 'create', $tag, '--repo', '${{ github.repository }}', '--title', $tag, '--notes-file', 'release-notes.md')
          if ($tag -match '-') { $args += '--prerelease' }   # SemVer pre-release, e.g. v0.2.0-beta.1
          $args += Get-ChildItem out | ForEach-Object { $_.FullName }
          gh @args
